 beschikbaar\",{\"_13\":146,\"_162\":-5,\"_163\":270,\"_27\":271,\"_130\":-5,\"_147\":272},\"Colour\",\"Kleur\",[273],\"Meerkleurig\",{\"_13\":146,\"_162\":-5,\"_163\":275,\"_27\":276,\"_130\":-5,\"_147\":277},\"Quality Label\",\"Kwaliteitslabel\",[278],\"CE\",{\"_13\":146,\"_162\":-5,\"_163\":280,\"_27\":281,\"_130\":-5,\"_147\":282},\"Mpn\",\"MPN (Manufacturer Part Number)\",[283],\"10328\",{\"_13\":146,\"_162\":-5,\"_163\":285,\"_27\":286,\"_130\":-5,\"_147\":287},\"Way of Building\",\"Manier van bouwen\",[288],\"Bouwstenen\",{\"_13\":146,\"_162\":-5,\"_163\":290,\"_27\":291,\"_130\":-5,\"_147\":292},\"Material\",\"Materiaal\",[293],\"Kunststof\",{\"_13\":146,\"_162\":295,\"_163\":296,\"_27\":297,\"_130\":-5,\"_147\":298},\"Sommige Internet of Things-apparaten werken ook op mobiele data. Als er bijzondere eisen zijn, bijv. 5G, staat dit altijd bij productinformatie.\",\"Mobile Data Connection Possible\",\"Mobiele data verbinding mogelijk\",[227],{\"_13\":146,\"_162\":300,\"_163\":301,\"_27\":302,\"_130\":-5,\"_147\":303},\"Apparaten die met internet verbinden kunnen worden voorzien van updates. Deze updates bevatten bijvoorbeeld nieuwe functies, of werken de beveiliging van het apparaat bij. Hoe lang een apparaat updates krijgt verschilt per product. Als het updatebeleid van een fabrikant voor een product bekend is, vermelden we dit in de productspecificaties. Houd hierbij ook de introductiedatum in gedachten. Het is belangrijk om je producten regelmatig van updates te voorzien. De updates zorgen ervoor dat je apparatuur veilig te gebruiken blijft. Het kan namelijk gebeuren dat er kwetsbaarheden worden ontdekt in de software van je apparaat. Deze kwetsbaarheden zouden door internetcriminelen gebruikt kunnen worden om bijvoorbeeld je gegevens te onderscheppen, of om toegang te krijgen tot andere apparaten op je thuisnetwerk, zoals je computer of smartphone. We raden dus aan om regelmatig te controleren of er updates voor je slimme apparaten beschikbaar zijn. Zo bl
