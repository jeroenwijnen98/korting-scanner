<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8524"/>
      <stop offset="100%" stop-color="#E65F00"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background in the app's accent orange -->
  <rect width="512" height="512" rx="108" ry="108" fill="url(#bg)"/>
  <rect width="512" height="512" rx="108" ry="108" fill="url(#shine)"/>

  <!-- Price tag, point facing left -->
  <path d="M172 120 H388 a28 28 0 0 1 28 28 V364 a28 28 0 0 1 -28 28 H172 L96 256 Z"
        fill="#FFFFFF"/>
  <circle cx="196" cy="256" r="20" fill="#E65F00"/>

  <!-- Barcode across the tag: what the scanner reads -->
  <g fill="#E65F00">
    <rect x="248" y="176" width="16" height="160" rx="6"/>
    <rect x="278" y="176" width="10" height="160" rx="5"/>
    <rect x="302" y="176" width="20" height="160" rx="8"/>
    <rect x="336" y="176" width="10" height="160" rx="5"/>
    <rect x="360" y="176" width="16" height="160" rx="6"/>
  </g>
</svg>
